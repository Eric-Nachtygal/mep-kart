<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEPKART</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Dots&display=swap" rel="stylesheet">
    <link rel="icon" href="sprites/champi.png">
</head>
<body>
    <main class="menu" aria-label="Menú principal" id="menu">
    <audio id="audioFondo" src="menu.ogg" loop autoplay></audio>
    <h1 class="titulo"><em>MEP<span class="kart" >KART</span></em></h1>
    <div class="buttons">
        <button id="play" class="primary" type="button">Jugar</button>
        <button id="tutorial" class="primary" type="button" onclick="location.href = 'tutorial.html'">Tutorial</button>
        <button id="config" class="primary" type="button">Configuración</button>
        <button id="carrera" class="mode-button" type="button" onclick="location.href='juego.html'" hidden>Carrera</button>
        <button id="contrarreloj" class="mode-button" type="button" onclick="location.href='contrarreloj.html'" hidden>Contrarreloj</button>
        <button id="volver" class="volver" type="button" hidden>Volver</button>
        <button id="acelerar" class="config" type="button" hidden></button>
        <label for="volumen" hidden class="config">Volumen de Música</label>
        <input type="range" class="config volumen" id="volumen" name="volumen" min="0" max="100" hidden>
        <label for="volumen2" hidden class="config">Volumen del Sonido</label>
        <input type="range" class="config volumen" id="volumen2" name="volumen2" min="0" max="100" hidden>
    </div>
    </main>
    <div class="inicio" id="inicio">
    <h1 class="tituloinicio"><em>MEP<span class="kart" >KART</span></em></h1>
    <h2>PRESIONE CUALQUIER BOTÓN PARA INICIAR</h2>
    </div>

    <script>
        const playButton = document.getElementById("play");
        const configButton = document.getElementById("config");
        const tutobutton = document.getElementById("tutorial");
        const modeButtons = document.querySelectorAll(".mode-button");
        const backButton = document.getElementById("volver");
        const configbotones = document.querySelectorAll(".config");
        const volumen = document.getElementById("volumen");
        const volumen2 = document.getElementById("volumen2");
        const acelerar = document.getElementById("acelerar");
        acelerar.innerHTML = "Acelerar: Manual";
        if (localStorage.getItem("acelerar") !== null && localStorage.getItem("acelerar") == "auto")
        {
            acelerar.innerHTML = "Acelerar: Automático";
        }
        const botones = document.querySelectorAll('button');
        const snd_hover = new Audio();
        snd_hover.src = "sonidos/menuhover.ogg";
        snd_hover.preload = "auto";
        const snd_selec = new Audio();
        snd_selec.src = "sonidos/menuseleccionar.ogg";
        snd_selec.preload = "auto";


        if (localStorage.getItem('volumen') == null)
        {
            localStorage.setItem('volumen', 70);
        }
        if (localStorage.getItem('volumen2') == null)
        {
            localStorage.setItem('volumen2', 100);
        }
        volumen.value = localStorage.getItem('volumen');
        document.getElementById("audioFondo").volume = localStorage.getItem("volumen") / 100;

        volumen2.value = localStorage.getItem('volumen2');
        snd_hover.volume = localStorage.getItem("volumen2") / 100;
        snd_selec.volume = localStorage.getItem("volumen2") / 100;
     


        const ref = document.referrer;

        if (!ref)
        {
            //entro desde el link
            document.addEventListener("keydown", iniciarjuego);

            document.addEventListener("click", iniciarjuego);
        }
        else 
        {
            const refHost = new URL(ref).hostname;

            if (refHost === location.hostname) 
            {
                //Viene de juego/contrarreloj
                document.getElementById("inicio").style.display = "none";
                document.getElementById("menu").style.display = "flex";
            } 
            else
            {
                //entro desde el link
                document.addEventListener("keydown", iniciarjuego);

                document.addEventListener("click", iniciarjuego);
            }
        }

        function iniciarjuego ()
        {
            snd_selec.play();
            document.getElementById("inicio").style.display = "none";
            document.getElementById("menu").style.display = "flex";
            document.getElementById("audioFondo").play();
            document.removeEventListener("keydown", iniciarjuego);
            document.removeEventListener("click", iniciarjuego);
        }

        playButton.addEventListener("click", () => {
            playButton.hidden = true;
            modeButtons.forEach((button) => {
                button.hidden = false;
            });
            tutobutton.hidden = true;
            backButton.hidden = false;
            configButton.hidden = true;
        });
        configButton.addEventListener("click", () => {
            configButton.hidden = true;
            tutobutton.hidden = true;
            playButton.hidden = true;
            backButton.hidden = false;
            configbotones.forEach((button) => {
                button.hidden = false;
            });
        });
        backButton.addEventListener("click", () => {
            backButton.hidden = true;
            tutobutton.hidden = false;
            configButton.hidden = false;
            playButton.hidden = false;
            modeButtons.forEach((button) => {
                button.hidden = true;
            });
            configbotones.forEach((button) => {
                button.hidden = true;
            });
        });
        
        acelerar.addEventListener("click", () =>
        {
            if (localStorage.getItem("acelerar") !== null && localStorage.getItem("acelerar") == "auto")
            {
                acelerar.innerHTML = "Acelerar: Manual";
                localStorage.setItem("acelerar", "manual");
            }
            else
            {
                acelerar.innerHTML = "Acelerar: Automático";
                localStorage.setItem("acelerar", "auto");
            }
        });

        volumen.addEventListener("input", () =>
        {
            localStorage.setItem('volumen', volumen.value);
            document.getElementById("audioFondo").volume = localStorage.getItem("volumen") / 100;
            //console.log(volumen.value);
        });

        volumen2.addEventListener("input", () =>
        {
            localStorage.setItem('volumen2', volumen2.value);
            snd_hover.volume = localStorage.getItem("volumen2") / 100;
            snd_selec.volume = localStorage.getItem("volumen2") / 100;
            //console.log(volumen2.value);
        });

        botones.forEach(boton => {
        
        //hover
        boton.addEventListener("mouseenter", () =>
        {
            const snd_hoveraux = new Audio(snd_hover.src);
            snd_hoveraux.volume = localStorage.getItem("volumen2") / 100;
            snd_hoveraux.play();
        });

        //click
        boton.addEventListener("click", () =>
        {
            const snd_selecaux = new Audio(snd_selec.src);
            snd_selecaux.volume = localStorage.getItem("volumen2") / 100;
            snd_selecaux.play();
        });

        });
        //document.addEventListener('pointerdown', desbloquearAudio, { once: true });

        
    </script>
</body>
</html>
