<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEPKART</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Dots&display=swap" rel="stylesheet">
    <link rel="icon" href="sprites/champi.png">
</head>
<body>
    <main class="menu" aria-label="Menú principal">
    <audio id="audioFondo" src="menu.ogg" loop autoplay></audio>
    <h1 class="titulo"><em>MEP<span class="kart" >KART</span></em></h1>
    <div class="buttons">
        <button id="play" class="primary" type="button">Jugar</button>
        <button id="config" class="primary" type="button">Configuración</button>
        <button id="carrera" class="mode-button" type="button" onclick="location.href='juego.html'" hidden>Carrera</button>
        <button id="contrarreloj" class="mode-button" type="button" onclick="location.href='contrarreloj.html'" hidden>Contrarreloj</button>
        <button id="volver" class="volver" type="button" hidden>Volver</button>
        <label for="volumen" hidden class="config">Volumen de Música</label>
        <input type="range" class="config" id="volumen" name="volumen" min="0" max="100" value="100" hidden>
    </div>
    </main>

    <script>
        const playButton = document.getElementById("play");
        const configButton = document.getElementById("config");
        const modeButtons = document.querySelectorAll(".mode-button");
        const backButton = document.getElementById("volver");
        const configbotones = document.querySelectorAll(".config");
        const volumen = document.getElementById("volumen");

        volumen.value = localStorage.getItem('volumen');
        document.getElementById("audioFondo").volume = localStorage.getItem("volumen") / 100;

        playButton.addEventListener("click", () => {
            playButton.hidden = true;
            modeButtons.forEach((button) => {
                button.hidden = false;
            });
            backButton.hidden = false;
            configButton.hidden = true;
        });
        configButton.addEventListener("click", () => {
            configButton.hidden = true;
            playButton.hidden = true;
            backButton.hidden = false;
            configbotones.forEach((button) => {
                button.hidden = false;
            });
        });
        backButton.addEventListener("click", () => {
            backButton.hidden = true;
            configButton.hidden = false;
            playButton.hidden = false;
            modeButtons.forEach((button) => {
                button.hidden = true;
            });
            configbotones.forEach((button) => {
                button.hidden = true;
            });
        });
        
        volumen.addEventListener("input", () =>
        {
            localStorage.setItem('volumen', volumen.value);
            document.getElementById("audioFondo").volume = localStorage.getItem("volumen") / 100;
            //console.log(volumen.value);
        });

        function desbloquearAudio()
        {
        const audio = document.getElementById("audioFondo");

            try
            {
                audio.muted = false;
                audio.play().catch(()=>{});
            } catch(e){}
        }
        document.addEventListener('pointerdown', desbloquearAudio, { once: true });
    </script>
</body>
</html>
