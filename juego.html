<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *
    {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        image-rendering: pixelated;
    }
    canvas
    {
        z-index: 99;
        width: 100%;
        height: 100vh;
        position: absolute;
        top: 0;
        left: 0;
    }
    body::-webkit-scrollbar 
    {
        width: 0px;
        height: 0px;
    }

</style>
<body>
    <canvas id="fondo"></canvas>
    <canvas id="canvas"></canvas>
</body>
</html>

<script>
const canvas = document.getElementById("canvas");
canvas.width = 1280;
canvas.height = 720;
const fondo = document.getElementById("fondo");
fondo.width = 854;
fondo.height = 480;
const ctx = canvas.getContext("2d", { willReadFrequently: true });
const fondo_ctx = fondo.getContext("2d", { willReadFrequently: false });
let auto = {x: 100, y: 100, ancho: 25, altura: 15, anchoimagen: 25, altoimagen: 15,  velocidad: 0, velocidadmax: 3.5, angulo: 0, angulo_muestra: 0};
let mouseapretado = false;
let teclas = {};
let mousex = 0;
let mousey = 0;
const imagenauto = new Image();
imagenauto.src = 'sprites/auto_jugador.png';
const mapa1 = new Image();
mapa1.src = 'sprites/mapa1.png';
/*PARA DESPUES: hacer un array con cada corredor (listaautos o algo asi), en colisiones() revisar colisiones entre los autos
(empujar en direccion de la colision), revisar si esta adentro de la ruta o no, y evitar que se salga de la pantalla
tambien tendriamos que correrlo para cada jugador cuando empieze el loop, y guardarlo (ej: auto.col_arriba, auto.col_abajo, etc)
esto evitaria tener que correr la funcion cada vez que necesitamos ver las colisiones como en khaos doom*/
function posicionmouse(e)
{
    mousex = (e.clientX) * (canvas.width / canvas.clientWidth);
    mousey = (e.clientY) * (canvas.height / canvas.clientHeight);
}

function colisiones(porcion)
{
    /*porcion.x += porcion.velocidadx;
    porcion.y += porcion.velocidady;*/
    //21x9
    //let alturahitbox = 20;
    let centrox = porcion.x + porcion.ancho / 2;
    let centroy = porcion.y + porcion.altura / 2;
    let hitbox_izq = porcion.x + 4;
    let hitbox_der = (porcion.x + porcion.ancho) - 2;
    let hitbox_abajo = (porcion.y + porcion.altura) -3;
    let hitbox_arriba = hitbox_abajo - 9;

    let colisiones = {abajo: true, arriba: true, izquierda: true, derecha: true};
    let listaObstaculos = obstaculos;


    //se fija que la porcion y el objeto esten tocandose
    for (let i = 0; i < listaObstaculos.length; i++)
    {
        if (listaObstaculos[i].x + listaObstaculos[i].ancho <= hitbox_izq || listaObstaculos[i].x >= hitbox_der || listaObstaculos[i].y + listaObstaculos[i].altura <= hitbox_abajo || listaObstaculos[i].y >= hitbox_abajo)
        {
            //costados
            if (listaObstaculos[i].x < centrox)
            {
                colisiones.izquierda = false;
            } 
            else if (listaObstaculos[i].x > centrox)
            {
                colisiones.derecha = false;
            }
            else
            {
                colisiones.izquierda = false;
                colisiones.derecha = false;
            }

            //arriba y abajo
            if (listaObstaculos[i].y < centroy)
            {
                colisiones.arriba = false;
            } 
            else if (listaObstaculos[i].x > centroy)
            {
                colisiones.abajo = false;
            }
            else
            {
                colisiones.arriba = false;
                colisiones.abajo = false;
            }

            break;
        }
    }

    /*porcion.x -= porcion.velocidadx;
    porcion.y -= porcion.velocidady;*/

    return colisiones;
}

function dibujar()
{
    if (auto.angulo != 0)
    {
        ctx.save();
        ctx.translate(auto.x + (auto.anchoimagen / 2), auto.y + (auto.altoimagen / 2));
        //ctx.rotate(auto.angulo * (Math.PI / 180));
        ctx.rotate(auto.angulo_muestra);
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(imagenauto, -auto.anchoimagen / 2, -auto.altoimagen / 2, auto.anchoimagen, auto.altoimagen);
        ctx.restore();
    }
    else
    {
        ctx.drawImage(imagenauto, auto.x, auto.y, auto.anchoimagen, auto.altoimagen);
    }
}

function moverjugador()
{
    document.addEventListener('keydown', function(e) 
    {
        e.preventDefault();
        teclas[e.key.toLowerCase()] = true;
        
    });
    
    document.addEventListener('keyup', function(e)
    {
        teclas[e.key.toLowerCase()] = false;
    });

    let mov = false;

    if (teclas['f5'])
    {
        window.location.href = "juego.html";
    }


   /* if (teclas['arrowright'] || teclas['d'] || teclas['arrowleft'] || teclas['a']) 
    {
        auto.velocidadmax = 5.25;
    }
    else
    {
        auto.velocidadmax = 6;
    }*/
    
    if (teclas['arrowup'] || teclas['w'] || teclas[' ']) 
    {
        mov = true; 
        if (auto.velocidad < auto.velocidadmax)
        {
            auto.velocidad += 0.25;
        }
        else if (auto.velocidad > auto.velocidadmax)
        {
            auto.velocidad = auto.velocidadmax;
        }
    } 
    if (teclas['arrowdown'] || teclas['s']) 
    {
        mov = true;
        if (auto.velocidad > -auto.velocidadmax)
        {
            auto.velocidad -= 0.25;
        } 
        else if (auto.velocidad <= -auto.velocidadmax)
        {
            auto.velocidad = -auto.velocidadmax;
        }
    }
    if (teclas['shift']) 
    {
        if (mov && teclas['arrowleft'] || teclas['a'])
        {
            auto.angulo -= 0.022*(auto.velocidad/2);
            auto.angulo_muestra = auto.angulo - 0.22*(auto.velocidad/2);
        }
        if (mov && teclas['arrowright'] || teclas['d'])
        {
            auto.angulo += 0.022*(auto.velocidad/2);
            auto.angulo_muestra = auto.angulo + 0.22*(auto.velocidad/2);
        }
    }
    else
    {
        auto.angulo_muestra = auto.angulo;
        if (teclas['arrowright'] || teclas['d']) 
        {
            auto.angulo += 0.017*(auto.velocidad/2);
            auto.angulo_muestra = auto.angulo;
        }
        if (teclas['arrowleft'] || teclas['a']) 
        {
            auto.angulo -= 0.017*(auto.velocidad/2);
            auto.angulo_muestra = auto.angulo;
        } 
    }
    

    
    canvas.addEventListener("mousedown", function (e) 
    {
        mouseapretado = true;
        posicionmouse(e);
    });

    canvas.addEventListener("mousemove", function(e)
    {
        if (mouseapretado)
        {
            posicionmouse(e);
        }
    });

    canvas.addEventListener("mouseup", function (e) 
    {
        mouseapretado = false;
    });

    if (mouseapretado)
    {
        mov = true;
        if (auto.velocidad < auto.velocidadmax)
        {
            auto.velocidad += 0.25;
        }
        else if (auto.velocidad > auto.velocidadmax)
        {
            auto.velocidad = auto.velocidadmax;
        }
        let aux_x = auto.x + (auto.anchoimagen / 2);
        let aux_y = auto.y + (auto.altoimagen / 2);
        let deltax = mousex - aux_x;
        let deltay = mousey - aux_y;
        let angulo_mouse = Math.atan2(deltay, deltax);
        let diferencia = Math.atan2(Math.sin(angulo_mouse - auto.angulo),Math.cos(angulo_mouse - auto.angulo));
        
        if (Math.abs(diferencia) <= Math.abs(0.017*(auto.velocidad/2))) //si la diferencia es muy poca no rota
        {
            auto.angulo = angulo_mouse;
        }
        else
        {
            if (teclas['shift'])
            {
                auto.angulo += Math.sign(diferencia) * Math.abs(0.022*(auto.velocidad/2));
                auto.angulo_muestra = auto.angulo + 0.22*(auto.velocidad/2);
            }
            else
            {
                auto.angulo += Math.sign(diferencia) * Math.abs(0.015*(auto.velocidad/2));
                auto.angulo_muestra = auto.angulo;
            }
            
        }
        /*if (auto.angulo > angulo_mouse)
        {
            auto.angulo += 0.017*(auto.velocidad/2);
        }
        else if (auto.angulo < angulo_mouse)
        {
            auto.angulo -= 0.017*(auto.velocidad/2);
        }*/
        
    }

    if (!mov)
    {
        if (auto.velocidad !=0)
        {
            if (auto.velocidad > 0)
            {
                auto.velocidad -= 0.25;
            }
            else
            {
                auto.velocidad += 0.25;
            }
        }
    }

    


    
    

    auto.x += Math.cos(auto.angulo) * auto.velocidad;
    auto.y += Math.sin(auto.angulo) * auto.velocidad;

}

function loop()
{
    ctx.clearRect(0,0,canvas.width, canvas.height);
    dibujar();
    moverjugador();
    requestAnimationFrame(loop);
}

imagenauto.onload = function()
{
    mapa1.onload = function()
    {
        fondo_ctx.drawImage(mapa1, 0, 0);
        //console.log(auto.x, auto.y);
        loop();
    }; 
};



</script>
