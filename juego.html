<script>
const canvas = document.getElementById("canvas");
canvas.width = 854;
canvas.height = 480;
const ctx = canvas.getContext("2d", { willReadFrequently: true });
let auto = {x: 100, y: 100, ancho: 25, altura: 15, anchoimagen: 25, altoimagen: 15,  velocidad_x: 0, velocidadmax_x: 6, angulo: 0};
let mouseapretado = false;
let teclas = {};
const imagenauto = new Image();
imagenauto.src = 'New Piskel.png';

tambien tendriamos que correrlo para cada jugador cuando empieze el loop, y guardarlo (ej: auto.col_arriba, auto.col_abajo, etc)
esto evitaria tener que correr la funcion cada vez que necesitamos ver las colisiones como en khaos doom*/

function dibujar()
{
    if (auto.angulo != 0)
    {
        ctx.save();
        ctx.translate(auto.x + (auto.anchoimagen / 2), auto.y + (auto.altoimagen / 2));
        //ctx.rotate(auto.angulo * (Math.PI / 180));
        ctx.rotate(auto.angulo);
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(imagenauto, -auto.anchoimagen / 2, -auto.altoimagen / 2, auto.anchoimagen, auto.altoimagen);
        ctx.restore();
    }
    else
    {
        ctx.drawImage(imagenauto, auto.x, auto.y, auto.anchoimagen, auto.altoimagen);
    }
}

function moverjugador()
{
    document.addEventListener('keydown', function(e) 
    {
        e.preventDefault();
        teclas[e.key.toLowerCase()] = true;
        
    });
    
    document.addEventListener('keyup', function(e)
    {
        teclas[e.key.toLowerCase()] = false;
    });

    let mov = false;

    if (teclas['f5'])
    {
        window.location.href = "juego.html";
    }


    if (teclas['arrowright'] || teclas['d'] || teclas['arrowleft'] || teclas['a']) 
    {
        auto.velocidadmax_x = 5.25;
    }
    else
    {
        auto.velocidadmax_x = 6;
    }
    
    if (teclas['arrowup'] || teclas['w'] || teclas[' ']) 
    {
        mov = true; 
        if (auto.velocidad_x < auto.velocidadmax_x)
        {
            auto.velocidad_x += 0.25;
        }
        else if (auto.velocidad_x > auto.velocidadmax_x)
        {
            auto.velocidad_x = auto.velocidadmax_x;
        }
    } 
    if (teclas['arrowdown'] || teclas['s']) 
    {
        mov = true;
        if (auto.velocidad_x > -auto.velocidadmax_x)
        {
            auto.velocidad_x -= 0.25;
        } 
        else if (auto.velocidad_x <= -auto.velocidadmax_x)
        {
            auto.velocidad_x = -auto.velocidadmax_x;
        }
    }
    if (teclas['arrowright'] || teclas['d']) 
    {
        auto.angulo += 0.02*(auto.velocidad_x/2);
    }
    if (teclas['arrowleft'] || teclas['a']) 
    {
        auto.angulo -= 0.02*(auto.velocidad_x/2);
    } 

    
    canvas.addEventListener("mousedown", function (e) 
    {
        if (!mouseapretado)
        {
            mouseapretado = true;
        }
    });

    canvas.addEventListener("mouseup", function (e) 
    {
        if (mouseapretado)
        {
            mouseapretado = false;
        }
    });

    if (mouseapretado)
    {
        mov = true;
        if (auto.velocidad_x < auto.velocidadmax_x)
        {
            auto.velocidad_x += 2;
        }
        else if (auto.velocidad_x > auto.velocidadmax_x)
        {
            auto.velocidad_x = auto.velocidadmax_x;
        }
    }

    if (!mov)
    {
        if (auto.velocidad_x !=0)
        {
            if (auto.velocidad_x > 0)
            {
                auto.velocidad_x -= 0.25;
            }
            else
            {
                auto.velocidad_x += 0.25;
            }
        }
    }

    


    
    

    auto.x += Math.cos(auto.angulo) * auto.velocidad_x;
    auto.y += Math.sin(auto.angulo) * auto.velocidad_x;

}

function loop()
{
    ctx.clearRect(0,0,canvas.width, canvas.height);
    dibujar();
    moverjugador();
    requestAnimationFrame(loop);
}

imagenauto.onload = function()
{
    console.log(auto.x, auto.y);
    loop();
};



</script>
