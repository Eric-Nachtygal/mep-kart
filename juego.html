function colisiones(porcion)
{
    porcion.x += Math.cos(porcion.angulo) * porcion.velocidad;
    porcion.y += Math.sin(porcion.angulo) * porcion.velocidad;
    //21x9
    //let alturahitbox = 20;
    let centrox = porcion.x + porcion.ancho / 2;
    let centroy = porcion.y + porcion.altura / 2;
    let hitbox_izq = porcion.x + 4;
    let hitbox_der = (porcion.x + porcion.ancho) - 2;
    let hitbox_abajo = (porcion.y + porcion.altura) -3;
    let hitbox_arriba = hitbox_abajo - 9;

    if (porcion.y <= 17)
    {
        porcion.y = 17;
    }
    else if (porcion.y >= canvas.height - 27)
    {
        porcion.y = canvas.height - 27;
    }

    if (porcion.x <= 7)
    {
        porcion.x = 7;
    }
    else if (porcion.x >= canvas.width - 27)
    {
        porcion.x = canvas.width - 27;
    }

    let colisiones = {abajo: true, arriba: true, izquierda: true, derecha: true};
    porcion.pasto = true;
    //se fija que la porcion y el objeto esten tocandose
    for (let i = 0; i < mapa1.length; i++)
    {
        let auxruta = mapa1[i].x + mapa1[i].ancho > hitbox_izq && mapa1[i].x < hitbox_der && mapa1[i].y + mapa1[i].altura > hitbox_arriba && mapa1[i].y < hitbox_abajo;
        if (auxruta)
        {
            porcion.pasto = false; // encontró un tramo de ruta
            break;
        }
    
    }
    objetos.forEach(objeto => 
    {
        
        if (!objeto.activo)
        {
            setTimeout(() => {objeto.activo = true; objeto.imagen = imagencaja;}, 1000);
        }
        let auxobjeto = objeto.x + objeto.ancho > hitbox_izq && objeto.x < hitbox_der && objeto.y + objeto.altura > hitbox_arriba && objeto.y < hitbox_abajo;
        if (auxobjeto && objeto.activo)
        {
            if (!porcion.o)
            {
                porcion.objeto = obj[Math.floor(Math.random() * 3)];
                porcion.o = true;
            }
            objeto.imagen = imagencaja2;
            objeto.activo = false;
            return;
        }
    });
    for (let i = 0; i < mapa1_checkpoints.length; i++)
    {
        let auxcheckpoint = mapa1_checkpoints[i].x + mapa1_checkpoints[i].ancho > hitbox_izq && mapa1_checkpoints[i].x < hitbox_der && mapa1_checkpoints[i].y + mapa1_checkpoints[i].altura > hitbox_arriba && mapa1_checkpoints[i].y < hitbox_abajo;
        if (auxcheckpoint)
        {
            if (porcion.checkpoint == i - 1)
            {
                porcion.checkpoint = i;
                break;
            }
            else if (porcion.checkpoint == mapa1_checkpoints.length - 1 && i == 0)
            {
                porcion.checkpoint = 0;
                porcion.vuelta += 1;
                //console.log("Vuelta: " + porcion.vuelta);
                break;
            }
        }
    }

    if (porcion.id != 1)
    {
        for (let i = 0; i < mapa1_caminobots.length; i++)
        {
            let auxcamino = mapa1_caminobots[i].x + mapa1_caminobots[i].ancho > hitbox_izq && mapa1_caminobots[i].x < hitbox_der && mapa1_caminobots[i].y + mapa1_caminobots[i].altura > hitbox_arriba && mapa1_caminobots[i].y < hitbox_abajo;
            if (auxcamino)
            {
                if (porcion.camino == i - 1)
                {
                    porcion.camino = i;
                    break;
                }
                else if (porcion.camino == mapa1_caminobots.length - 1 && i == 0)
                {
                    porcion.camino = 0;
                    //console.log("Vuelta: " + porcion.vuelta);
                    break;
                }
            }
        
        }
    }

    for (let i = 0; i < mapa1_obstaculos.length; i++)
    {
        let auxobstaculo = mapa1_obstaculos[i].x + mapa1_obstaculos[i].ancho > hitbox_izq && mapa1_obstaculos[i].x < hitbox_der && mapa1_obstaculos[i].y + mapa1_obstaculos[i].altura > hitbox_arriba && mapa1_obstaculos[i].y < hitbox_abajo;
        if (auxobstaculo)
        {
            //donde hay mas colision
            let colisionx = (mapa1_obstaculos[i].x + mapa1_obstaculos[i].ancho < hitbox_der ? mapa1_obstaculos[i].x + mapa1_obstaculos[i].ancho : hitbox_der) - (mapa1_obstaculos[i].x > hitbox_izq ? mapa1_obstaculos[i].x : hitbox_izq);
            let colisiony = (mapa1_obstaculos[i].y + mapa1_obstaculos[i].altura < hitbox_abajo ? mapa1_obstaculos[i].y + mapa1_obstaculos[i].altura : hitbox_abajo) - (mapa1_obstaculos[i].y > hitbox_arriba ? mapa1_obstaculos[i].y : hitbox_arriba);


            if (colisionx < colisiony)
            {
                //costados
                if (mapa1_obstaculos[i].x + mapa1_obstaculos[i].ancho / 2 < centrox)
                {
                    colisiones.izquierda = false;
                    porcion.x = mapa1_obstaculos[i].x + mapa1_obstaculos[i].ancho - 4;
                } 
                else
                {
                    colisiones.derecha = false;
                    porcion.x = mapa1_obstaculos[i].x - (porcion.ancho - 2);
                }
            }
            else
            {
                //arriba y abajo
                if (mapa1_obstaculos[i].y + mapa1_obstaculos[i].altura / 2  < centroy)
                {
                    colisiones.arriba = false;
                    porcion.y = mapa1_obstaculos[i].y + mapa1_obstaculos[i].altura - (porcion.altura - 12);
                } 
                else
                {
                    colisiones.abajo = false;
                    porcion.y = mapa1_obstaculos[i].y - (porcion.altura - 3);
                }
            }
        }
    }

    for (let i = 0; i < autos.length; i++)
    {
        if (autos[i].id != porcion.id && autos[i].vuelta < 5)
        {
            let auxauto = autos[i].x + autos[i].ancho > hitbox_izq && autos[i].x < hitbox_der && autos[i].y + autos[i].altura > hitbox_arriba && autos[i].y < hitbox_abajo;
            if (auxauto)
            {
                //donde hay mas colision
                let colisionx = (autos[i].x + autos[i].ancho < hitbox_der ? autos[i].x + autos[i].ancho : hitbox_der) - (autos[i].x > hitbox_izq ? autos[i].x : hitbox_izq);
                let colisiony = (autos[i].y + autos[i].altura < hitbox_abajo ? autos[i].y + autos[i].altura : hitbox_abajo) - (autos[i].y > hitbox_arriba ? autos[i].y : hitbox_arriba);


                if (colisionx < colisiony)
                {
                    //costados
                    if (autos[i].x + autos[i].ancho / 2 < centrox)
                    {
                        colisiones.izquierda = false;
                        porcion.x = autos[i].x + autos[i].ancho - 7;
                    } 
                    else
                    {
                        colisiones.derecha = false;
                        porcion.x = autos[i].x - (porcion.ancho - 5);
                    }
                }
                else
                {
                    //arriba y abajo
                    if (autos[i].y + autos[i].altura / 2  < centroy)
                    {
                        colisiones.arriba = false;
                        porcion.y = autos[i].y + autos[i].altura - (porcion.altura - 15);
                    } 
                    else
                    {
                        colisiones.abajo = false;
                        porcion.y = autos[i].y - (porcion.altura - 6);
                    }
                }
            }
        }
    }
    

    porcion.x -= Math.cos(porcion.angulo) * porcion.velocidad;
    porcion.y -= Math.sin(porcion.angulo) * porcion.velocidad;
    
    return colisiones;
}

function dibujar()
{

                ctx.save();

                //ctx.rotate(auto.angulo * (Math.PI / 180));
                ctx.rotate(autos[i].angulo_muestra);

function moverjugador()
{
    if (tiempo.principio < 1)
    {
        let mov = false;


        //console.log(auto.pasto);
        if (auto.vuelta == 5)
        {
            if (auto.velocidad < 0)
            {
                auto.velocidad = 0;
            }
        }
        if (auto.vuelta < 5)
        {
            if (auto.pasto && !auto.boost)
            {
                auto.velocidadmax = 2;
                auto.min_turbo_con = 0;
                auto.min_turbo = 0;
            }

        /* if (teclas['arrowright'] || teclas['d'] || teclas['arrowleft'] || teclas['a']) 
            {
                auto.velocidadmax = 5.25;
            }
            else
            {
                auto.velocidadmax = 6;
            }*/
            if(auto.boost)
            {
                auto.velocidadmax = 8;
                auto.velocidad = 8;
                setTimeout(function() {auto.boost = false; auto.velocidadmax= 4.25;}, 3000); 
            }
            //console.log(auto.objeto);
            if(auto.o && auto.objeto == "champi" && teclas['q'])
            {
                auto.boost = true;
                auto.o = false;
                auto.objeto = null;
            }
            if (teclas['arrowup'] || teclas['w'] || teclas[' ']) 
            {
                mov = true; 
                if (auto.velocidad < auto.velocidadmax)
                {
                    auto.velocidad += 0.25;
                }
                else if (auto.velocidad >= auto.velocidadmax)
                {
                    auto.velocidad = auto.velocidadmax;
                }
            } 
            if (teclas['arrowdown'] || teclas['s']) 
            {
                mov = true;
                if (auto.velocidad > -auto.velocidadmax)
                {
                    auto.velocidad -= 0.25;
                } 
                else if (auto.velocidad <= -auto.velocidadmax)
                {
                    auto.velocidad = -auto.velocidadmax;
                }
            }
            if (teclas['shift']) 
            {
                if (auto.min_turbo != 0)
                {
                    auto.velocidadmax = 7;
                    auto.min_turbo -= 0.04;
                    if (auto.min_turbo < 0)
                    {
                        auto.min_turbo = 0;
                    }
                }
                else
                {
                    auto.velocidadmax= 4.25;
                }
                if (mov && teclas['arrowleft'] || teclas['a'])
                {
                    auto.angulo -= 0.022*(auto.velocidad/2);
                    auto.angulo_muestra = auto.angulo - 0.24*(auto.velocidad/2);
                }
                if (mov && teclas['arrowright'] || teclas['d'])
                {
                    auto.angulo += 0.022*(auto.velocidad/2);
                    auto.angulo_muestra = auto.angulo + 0.24*(auto.velocidad/2);
                }
                if (mov && (teclas['arrowright'] || teclas['d'] || teclas['arrowleft'] || teclas['a']))
                {
                    auto.min_turbo_con += 0.02;
                }
                else
                {
                    auto.min_turbo_con += 0.01;
                }
            }
            else
            {
                if (auto.min_turbo_con > 4)
                {
                    auto.velocidadmax = 7;
                    auto.min_turbo_con = 0;
                    auto.min_turbo = 4;
                }
                else if (auto.min_turbo_con > 2)
                {
                    auto.velocidadmax = 7;
                    auto.min_turbo_con = 0;
                    auto.min_turbo = 2;
                }
                else if (auto.min_turbo_con > 1)
                {
                    auto.velocidadmax = 7;
                    auto.min_turbo_con = 0;
                    auto.min_turbo = 1;
                }
                else if (auto.min_turbo != 0)
                {
                    auto.min_turbo -= 0.04;
                    if (auto.min_turbo < 0)
                    {
                        auto.min_turbo = 0;
                    }
                }
                else
                {
                    if (auto.pasto)
                    {
                        auto.velocidadmax = 3.75;
                    }
                    else
                    {
                        auto.velocidadmax = 4.75;
                    }
                    auto.min_turbo_con = 0;
                }
                auto.angulo_muestra = auto.angulo;
                if (teclas['arrowright'] || teclas['d']) 
                {
                    auto.angulo += 0.017*(auto.velocidad/2);
                    auto.angulo_muestra = auto.angulo;
                }
                if (teclas['arrowleft'] || teclas['a']) 
                {
                    auto.angulo -= 0.017*(auto.velocidad/2);
                    auto.angulo_muestra = auto.angulo;
                } 
            }
            

            
            canvas.addEventListener("mousedown", function (e) 
            {
                //click 0 es izquierdo, 1 es medio (ruedita) y 2 es derecho
                if (e.button == 0)
                {
                    mouseapretado = true;
                    posicionmouse(e);
                }
                if (e.button == 2)
                {
                    teclas['shift'] = true;
                }
            });

            canvas.addEventListener("mousemove", function(e)
            {
                if (mouseapretado)
                {
                    posicionmouse(e);
                }
            });

            canvas.addEventListener("mouseup", function (e) 
            {
                if (e.button == 0)
                {
                    mouseapretado = false;
                }
                if (e.button == 2)
                {
                    teclas['shift'] = false;
                }
                
            });

            if (mouseapretado)
            {
                mov = true;
                if (auto.velocidad < auto.velocidadmax)
                {
                    auto.velocidad += 0.25;
                }
                else if (auto.velocidad >= auto.velocidadmax)
                {
                    auto.velocidad = auto.velocidadmax;
                }
                let aux_x = auto.x + (auto.anchoimagen / 2);
                let aux_y = auto.y + (auto.altoimagen / 2);
                let deltax = mousex - aux_x;
                let deltay = mousey - aux_y;
                let angulo_mouse = Math.atan2(deltay, deltax);
                let diferencia = Math.atan2(Math.sin(angulo_mouse - auto.angulo),Math.cos(angulo_mouse - auto.angulo));
                
                if (Math.abs(diferencia) <= Math.abs(0.017*(auto.velocidad/2))) //si la diferencia es muy poca no rota
                {
                    auto.angulo = angulo_mouse;
                }
                else
                {
                    if (teclas['shift'])
                    {
                        auto.angulo += Math.sign(diferencia) * Math.abs(0.022*(auto.velocidad/2));
                        auto.angulo_muestra = auto.angulo + 0.22*(auto.velocidad/2);
                    }
                    else
                    {
                        auto.angulo += Math.sign(diferencia) * Math.abs(0.017*(auto.velocidad/2));
                        auto.angulo_muestra = auto.angulo;
                    }
                    
                }
                /*if (auto.angulo > angulo_mouse)
                {
                    auto.angulo += 0.017*(auto.velocidad/2);
                }
                else if (auto.angulo < angulo_mouse)
                {
                    auto.angulo -= 0.017*(auto.velocidad/2);
                }*/
                
            }

            if (!mov)
            {
                if (auto.velocidad !=0)
                {
                    if (auto.velocidad > 0)
                    {
                        auto.velocidad -= 0.25;
                    }
                    else
                    {
                        auto.velocidad += 0.25;
                    }
                }
            }
        }
        else
        {
            if (auto.velocidad !=0)
                {
                    if (auto.velocidad > 0)
                    {
                        auto.velocidad -= 0.05;
                    }
                    else
                    {
                        auto.velocidad += 0.05;
                    }
                }
        }
        


        
        

        auto.x += Math.cos(auto.angulo) * auto.velocidad;
        auto.y += Math.sin(auto.angulo) * auto.velocidad;
    }
}

function moverbots()
{
    if (tiempo.principio < 1)
    {
        for (let i = 1; i < autos.length; i++)
        {
            if (autos[i].vuelta < 5)
            {
                if (autos[i].velocidad < autos[i].velocidadmax)
                {
                    autos[i].velocidad += 0.25;
                }
                else if (autos[i].velocidad >= autos[i].velocidadmax)
                {
                    autos[i].velocidad = autos[i].velocidadmax;
                }

                let aux_x = autos[i].x + (autos[i].anchoimagen / 2);
                let aux_y = autos[i].y + (autos[i].altoimagen / 2);
                let deltax;
                let deltay;
                let rndx = Math.floor(Math.random() * (15) - 7);
                let rndy = Math.floor(Math.random() * (15) - 7);
                if (autos[i].camino >= mapa1_caminobots.length - 1)
                {
                    deltax = mapa1_caminobots[0].x - aux_x + rndx;
                    deltay = mapa1_caminobots[0].y - aux_y + rndy;
                }
                else
                {
                    deltax = mapa1_caminobots[autos[i].camino+1].x - aux_x + rndx;
                    deltay = mapa1_caminobots[autos[i].camino+1].y - aux_y + rndy;
                }
                
                let angulo_check = Math.atan2(deltay, deltax);
                let diferencia = Math.atan2(Math.sin(angulo_check - autos[i].angulo),Math.cos(angulo_check - autos[i].angulo));
                
                if (Math.abs(diferencia) <= Math.abs(0.017*(auto.velocidad/2))) //si la diferencia es muy poca no rota
                {
                    autos[i].angulo = angulo_check;
                }
                else
                {
                    autos[i].angulo += Math.sign(diferencia) * Math.abs(0.017*(autos[i].velocidad/2));
                    autos[i].angulo_muestra = autos[i].angulo;
                }
            }
            else
            {
                if (autos[i].velocidad !=0)
                {
                    if (autos[i].velocidad > 0)
                    {
                        autos[i].velocidad -= 0.05;
                    }
                    else
                    {
                        autos[i].velocidad += 0.05;
                    }
                }
            }
            if (autos[i].vuelta == 5)
            {
                if (autos[i].velocidad < 0)
                {
                    autos[i].velocidad = 0;
                }
            }

            autos[i].x += Math.cos(autos[i].angulo) * autos[i].velocidad;
            autos[i].y += Math.sin(autos[i].angulo) * autos[i].velocidad;
        }
    }
}

function loop()
{
    ctx.clearRect(0,0,canvas.width, canvas.height);
    dibujar();
    if (!pausa)
    {
        for (let i=0; i<autos.length; i++)
        {
            if (autos[i].vuelta < 5)
            {
                colisiones(autos[i]);
            }
        }
        moverjugador();
        moverbots();
        definir_puestos();
    }
    requestAnimationFrame(loop);
}

function definir_puestos()
{
    let distancias = [];
    for (let i= 0; i < autos.length; i++)
    {
        let auxdistancia;
        let auxdistanciax;
        let auxdistanciay;
        if (autos[i].checkpoint >= mapa1_checkpoints.length - 1)
        {
            auxdistanciax = Math.abs(autos[i].x - mapa1_checkpoints[0].x);
            auxdistanciay = Math.abs(autos[i].y - mapa1_checkpoints[0].y);
        }   
        else
        {
            auxdistanciax = Math.abs(autos[i].x - mapa1_checkpoints[autos[i].checkpoint + 1].x);
            auxdistanciay = Math.abs(autos[i].y - mapa1_checkpoints[autos[i].checkpoint + 1].y);
        }
        auxdistancia = Math.hypot(auxdistanciax,auxdistanciay);
        distancias.push({dist:auxdistancia, auto:i, check:autos[i].checkpoint, vuelta:autos[i].vuelta});
    }

    distancias.sort((a, b) => 
    {
        if (b.vuelta !== a.vuelta)
        {
            return b.vuelta - a.vuelta;
        }
        if (b.check !== a.check)
        {
            return b.check - a.check;
        }
        return a.dist - b.dist;
    });

    for (let i= 0; i < autos.length; i++)
    {
        for (let j=0; j < distancias.length; j++)
        {
            if (distancias[j].auto == i)
            {
                autos[i].puesto = j + 1;
                break;
            }
        }
    }
}
